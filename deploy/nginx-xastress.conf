# /etc/nginx/sites-available/xastress
# Sau khi chạy certbot --nginx, certbot sẽ tự thêm khối HTTPS & chuyển hướng 80 -> 443.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream xastress_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name xastress.info.vn www.xastress.info.vn;

    # Quyền riêng tư: không ghi log IP người dùng
    access_log off;

    client_max_body_size 64k;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Gom www về tên miền chính
    if ($host = www.xastress.info.vn) {
        return 301 $scheme://xastress.info.vn$request_uri;
    }

    location /socket.io/ {
        proxy_pass http://xastress_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://xastress_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
